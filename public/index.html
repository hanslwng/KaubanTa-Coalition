<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KaubanTa Coalition (Together Coalition)</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--alt:#f2f6ff;--tx:#1b2340;--mu:#515a78;--bd:#dde4f3;--btn:#0038a5;--or:#ffb822;--sun:#ffb822;--link:#0038a5;--card:#fff;--hd:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1230;--alt:#111d47;--tx:#f1f4ff;--mu:#b4bddb;--bd:#243468;--link:#ffb822;--card:#111d47;--hd:#0a1230;--btn:#2f63d6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1230;--alt:#111d47;--tx:#f1f4ff;--mu:#b4bddb;--bd:#243468;--link:#ffb822;--card:#111d47;--hd:#0a1230;--btn:#2f63d6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 1rem/1.6 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
a{color:var(--link)}
h1,h2,h3{line-height:1.1;margin:0 0 .6rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.6rem,4vw,2.4rem)}h3{font-size:1.2rem}
p{margin:0 0 1rem;max-width:68ch}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--hd);border-bottom:1px solid var(--bd);z-index:9}
.bar{max-width:1080px;margin:auto;padding:.7rem 1.2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.3rem;text-decoration:none;color:var(--tx);margin-right:auto}
.brand b{color:var(--link)}
nav{display:flex;gap:.2rem;flex-wrap:wrap}
nav a{padding:.45rem .8rem;border-radius:99px;text-decoration:none;color:var(--tx);font-weight:600;font-size:.95rem}
nav a.on{background:var(--or);color:#1b2340}
nav a:hover:not(.on){background:var(--alt)}
#mt{display:none;background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:.4rem .8rem;font:inherit}
@media(max-width:760px){#mt{display:block}nav{display:none;width:100%;flex-direction:column}nav.open{display:flex}}
main{min-height:70vh}
.w{max-width:1080px;margin:auto;padding:3rem 1.2rem}
.alt{background:var(--alt)}
.hero{background:#0038a5;color:#fff}
.hero .w{padding:4.5rem 1.2rem}
.hero h1{font-size:clamp(3.2rem,12vw,7.5rem);margin-bottom:1rem}
.hero h1 span{color:var(--sun)}
.hero p{font-size:1.2rem}
.btn{display:inline-block;background:var(--btn);color:#fff;border:2px solid var(--btn);border-radius:99px;padding:.7rem 1.4rem;font:600 1rem inherit;font-family:inherit;text-decoration:none;cursor:pointer;margin:0 .5rem .5rem 0}
.btn.y{background:var(--sun);border-color:var(--sun);color:#1b2340}
.btn.o{background:none;color:#fff;border-color:#fff}
.btn.g{background:none;color:var(--tx);border-color:var(--bd)}
button:disabled{opacity:.55;cursor:not-allowed}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.hero :focus-visible,footer :focus-visible{outline-color:#ffb822}
.stats{display:flex;gap:2.5rem;flex-wrap:wrap;margin-top:2rem}
.stats div{font-size:.95rem}.stats strong{display:block;font-size:2rem;line-height:1}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.2rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:1.2rem}
.card .meta{color:var(--mu);font-size:.9rem;margin-bottom:.6rem}
.cover{height:110px;border-radius:10px;margin-bottom:.9rem;display:flex;align-items:flex-end;padding:.7rem 1rem;font-weight:800;font-size:1.5rem;color:#1b2340}
.c0{background:var(--sun)}.c1{background:#0038a5;color:#fff}.c2{background:#9cc4ff}
.tag{display:inline-block;background:var(--alt);border:1px solid var(--bd);border-radius:99px;padding:.1rem .7rem;font-size:.85rem;margin:0 .3rem .3rem 0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
form{display:grid;gap:1rem;max-width:640px}
label{display:grid;gap:.3rem;font-weight:600;font-size:.95rem}
input,select,textarea{font:inherit;padding:.65rem .8rem;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);width:100%}
fieldset{border:1px solid var(--bd);border-radius:10px;padding:.8rem 1rem}
fieldset label{display:inline-flex;grid-template-columns:none;align-items:center;gap:.4rem;font-weight:400;margin:0 1rem .3rem 0}
fieldset input{width:auto}
.hp{position:absolute;left:-9999px}
.err{font-weight:600;border-left:4px solid var(--or);padding-left:.6rem}
.ok{background:var(--alt);border:2px solid var(--or);border-radius:14px;padding:1.2rem;max-width:640px;font-weight:600}
.banner{background:#ffb822;color:#1b2340;padding:.8rem 1.2rem;font-weight:600}
.banner a{color:#1b2340}
.tl{border-left:3px solid var(--or);padding-left:1.2rem;margin:0}
.tl p{margin-bottom:1rem}
.av{width:64px;height:64px;border-radius:50%;background:var(--sun);color:#1b2340;display:grid;place-items:center;font-weight:800;font-size:1.3rem;margin-bottom:.6rem}
details{border-bottom:1px solid var(--bd);padding:.8rem 0;max-width:720px}
summary{font-weight:600;cursor:pointer}
.rsvp{margin-top:.8rem}.rsvp[hidden]{display:none}
.scroll{overflow:auto;margin:0 0 1.5rem}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border:1px solid var(--bd);padding:.45rem .55rem;text-align:left;vertical-align:top;word-break:break-word}
th{background:var(--alt)}
footer{background:#00296f;color:#f1f4ff}
footer a{color:#ffb822}
footer .w{padding:2.5rem 1.2rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.5rem}
footer form{max-width:none}
footer input{color:#1b2340;background:#fff}
@media(prefers-reduced-motion:no-preference){.ok{animation:pop .3s}}
@keyframes pop{from{transform:scale(.97);opacity:.5}}
</style>
</head>
<body>
<header><div class="bar"><a class="brand" href="#home">Kauban<b>Ta</b> Coalition</a><button id="mt" type="button" aria-expanded="false">Menu</button>
<nav id="nav" aria-label="Main"><a href="#home">Home</a><a href="#about">About</a><a href="#signup">Sign Up</a><a href="#weekly">Weekly News</a><a href="#monthly">Monthly News</a><a href="#volunteer">Volunteer</a><a href="#contact">Contact Us</a></nav></div></header>
<main id="app"></main>
<footer><div class="w">
<div><h3>KaubanTa Coalition</h3><p>Also known as Together Coalition. Youth-led service across the Philippines.</p></div>
<div><h3>Quick links</h3><p><a href="#about">About</a><br><a href="#signup">Sign Up</a><br><a href="#volunteer">This week’s activities</a><br><a href="#contact">Contact Us</a><br><a href="#admin">Admin</a></p></div>
<div><h3>Get the newsletter</h3><form data-api="subscribe" data-ok="Salamat! You’re subscribed."><label>Email<input name="e" type="email" required autocomplete="email"></label><button class="btn y" type="submit">Subscribe</button></form></div>
</div><div class="w" style="padding-top:0;display:block"><p id="social" hidden></p><small>© 2026 KaubanTa Coalition</small></div></footer>
<script>
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inp=(l,n,t="text",r=1,x="")=>`<label>${l}<input name="${n}" type="${t}" ${r?"required":""} ${x}></label>`;
let A=[], W=[], M=[], site={}, stats={volunteers:0,events:0,communities:0}, dbOk=false, ready=null, seq=0, adminNote="";
function fmtWhen(iso){const d=new Date(iso); if(Number.isNaN(d.getTime()))return iso; return d.toLocaleString("en-PH",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}
function fmtDate(s){const d=new Date(String(s).slice(0,10)+"T00:00:00"); if(Number.isNaN(d.getTime()))return String(s||""); return d.toLocaleDateString("en-PH",{month:"short",day:"numeric",year:"numeric"})}
function mapAct(a){const iso=String(a.starts_at||"").replace(" ","T"); return {id:a.id,t:a.title||"",d:fmtWhen(iso),v:a.venue||"",c:a.cause||"",s:Number(a.slots)||0,x:a.description||"",iso}}
function mapNews(n){return {id:n.id,t:n.title||"",d:n.period||fmtDate(n.published_at),s:n.summary||"",f:n.featured||"",b:String(n.body||"").split(/\n\s*\n/).filter(Boolean),pdf:/^https:\/\//i.test(n.pdf_url||"")?n.pdf_url:""}}
function isUpcoming(a){const t=new Date(a.iso).getTime(); return !Number.isNaN(t)&&t>=Date.now()}
function statNum(n){return dbOk?Number(n||0).toLocaleString("en-US"):"—"}
async function load(){
  dbOk=false;
  let aRes=null,nRes=null,sRes=null;
  try{[aRes,nRes,sRes]=await Promise.all([fetch("/api/activities"),fetch("/api/newsletters"),fetch("/api/site")])}
  catch(e){return}
  try{if(sRes&&sRes.ok)site=await sRes.json()}catch(e){}
  try{
    if(aRes&&aRes.ok&&nRes&&nRes.ok){
      const acts=await aRes.json(), news=await nRes.json();
      A=(acts.activities||[]).map(mapAct);
      stats=acts.stats||stats;
      const all=news.newsletters||[];
      W=all.filter(n=>n.type==="weekly").map(mapNews);
      M=all.filter(n=>n.type==="monthly").map(mapNews);
      dbOk=true;
    }
  }catch(e){dbOk=false}
}
function ensure(){if(!ready)ready=load().catch(()=>{ready=null}); return ready}
function banner(){return dbOk?"":`<div class="banner" role="status">The database is not connected, so sign-ups and activities cannot be saved yet. After setup, open <a href="/api/health">/api/health</a> to confirm it.</div>`}
function fillSocial(){
  const el=$("#social"); if(!el)return;
  const items=[["Facebook",site.facebook],["Instagram",site.instagram],["TikTok",site.tiktok],["X",site.x]].filter(([,u])=>/^https:\/\//i.test(u||""));
  el.hidden=!items.length;
  el.innerHTML=items.map(([n,u])=>`<a href="${esc(u)}">${n}</a>`).join(" · ");
}
const cover=(i,t)=>`<div class="cover c${i%3}">${esc(t)}</div>`;
function nlCard(k,x,i){const label=k==="w"?"Week":(x.t.split(" ")[0]||"Issue"); return `<article class="card">${cover(i,label)}<div class="meta">${esc(x.d)}</div><h3>${esc(x.t)}</h3><p>${esc(x.s)}</p><a href="#issue-${k}${x.id}">Read this issue</a></article>`}
const sub=`<form data-api="subscribe" data-ok="Salamat! You’re subscribed." style="grid-template-columns:1fr auto;align-items:end;max-width:560px"><label>Email<input name="e" type="email" required autocomplete="email"></label><button class="btn" type="submit" style="margin:0">Subscribe</button></form>`;
function home(){
  const soon=A.filter(isUpcoming).slice(0,3);
  const news=[W[0]?nlCard("w",W[0],0):"",M[0]?nlCard("m",M[0],0):""].filter(Boolean).join("");
  return `<section class="hero"><div class="w"><h1>Kauban ta<span>.</span></h1><p>We’re a youth-led coalition of volunteers serving communities across the Philippines. Join a weekly activity, read our newsletters, or start where you are.</p><a class="btn y" href="#signup">Join the Coalition</a><a class="btn o" href="#volunteer">See volunteer activities</a>
<div class="stats"><div><strong>${statNum(stats.volunteers)}</strong>volunteers</div><div><strong>${statNum(stats.events)}</strong>events</div><div><strong>${statNum(stats.communities)}</strong>communities reached</div></div></div></section>
<section class="w"><h2>Happening this week</h2><div class="g3">${soon.length?soon.map(actCard).join(""):"<p>No upcoming activities yet.</p>"}</div></section>
<section class="alt"><div class="w"><h2>Latest from our newsletters</h2><div class="g3">${news||"<p>No newsletters yet.</p>"}</div></div></section>`}
function about(){return `<section class="w"><h2>About KaubanTa</h2><p>KaubanTa Coalition, also called Together Coalition, brings young Filipinos together to serve their communities. We organize weekly volunteer activities, train new leaders, and share what we learn.</p>
<div class="g3" style="margin:2rem 0"><div class="card"><h3>Mission</h3><p>Make community service easy to join, fun to keep doing, and led by youth.</p></div><div class="card"><h3>Vision</h3><p>A Philippines where every young person has a place to help.</p></div><div class="card"><h3>Values</h3><p>Bayanihan, honesty, inclusion, and showing up on time.</p></div></div>
<h2>Our story</h2><div class="tl"><p><b>2023:</b> A group of student leaders ran the first clean-up.</p><p><b>2024:</b> We started weekly activities and our first newsletter.</p><p><b>2026:</b> Sign-ups, weekly activities, and newsletters run in one place.</p></div></section>
<section class="alt"><div class="w"><h2>What we work on</h2><p>${["Environment","Education","Disaster response","Health","Advocacy","Relief"].map(x=>`<span class="tag">${x}</span>`).join("")}</p>
<h2 style="margin-top:2rem">Our team</h2><div class="row">${[["MC","Maria Cruz","Coalition Head"],["JR","Jun Reyes","Programs Lead"],["AS","Ana Santos","Volunteer Coordinator"],["LD","Leo Dizon","Communications"]].map(x=>`<div class="card"><div class="av">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join("")}</div>
<h2 style="margin-top:2rem">Partners</h2><p>${["Partner School A","LGU Partner","Local NGO","Youth Council"].map(x=>`<span class="tag">${x}</span>`).join("")}</p></div></section>`}
function signup(){return `<section class="w"><h2>Sign up to volunteer</h2><p>Sama ka na! Fill this out and we’ll email you within three days.</p>
<form data-api="signup" data-ok="Salamat! We got your sign-up.">
${inp("Full name","n","text",1,'autocomplete="name"')}${inp("Email","e","email",1,'autocomplete="email"')}${inp("Mobile number","m","tel",1,'autocomplete="tel"')}${inp("Birthday","b","date")}${inp("School or workplace","s","text",0)}${inp("City and province","c","text",1,'autocomplete="address-level2"')}
<fieldset><legend>Interests</legend>${["Education","Environment","Health","Disaster response","Advocacy","Relief"].map(x=>`<label><input type="checkbox" name="i" value="${x}">${x}</label>`).join("")}</fieldset>
<fieldset><legend>Availability</legend><label><input type="checkbox" name="a" value="Weekdays">Weekdays</label><label><input type="checkbox" name="a" value="Weekends">Weekends</label></fieldset>
<label>How did you hear about us?<select name="h"><option>Friend or classmate</option><option>Social media</option><option>School event</option><option>Other</option></select></label>
<label style="display:flex;gap:.5rem;font-weight:400"><input type="checkbox" name="p" value="1" required style="width:auto;margin-top:.3rem">I agree that KaubanTa may process my information under the Data Privacy Act of 2012.</label>
<button class="btn" type="submit">Sign me up</button></form></section>`}
function nl(k){const D=k==="w"?W:M; return `<section class="w"><h2>${k==="w"?"Weekly newsletters":"Monthly newsletters"}</h2><p>${k==="w"?"A short recap of each week and what’s next.":"Monthly highlights, volunteer spotlights, and a look at the month ahead."}</p>${sub}<div class="g3" style="margin-top:2rem">${D.length?D.map((x,i)=>nlCard(k,x,i)).join(""):"<p>No issues yet.</p>"}</div></section>`}
function issue(k,id){const x=(k==="w"?W:M).find(n=>n.id===id); if(!x)return nl(k); const label=k==="w"?"Week":(x.t.split(" ")[0]||"Issue"); return `<section class="w"><p><a href="#${k==="w"?"weekly":"monthly"}">Back to ${k==="w"?"weekly":"monthly"} newsletters</a></p>${cover(id,label)}<h2>${esc(x.t)}</h2><p class="meta" style="color:var(--mu)">${esc(x.d)}</p>${x.f?`<p><b>${esc(x.f)}</b></p>`:""}${x.b.map(p=>`<p>${esc(p)}</p>`).join("")}<a class="btn" href="#volunteer">See this week’s activities</a>${x.pdf?`<a class="btn g" href="${esc(x.pdf)}">Download PDF</a>`:""}${k==="m"?`<button class="btn g" type="button" onclick="print()">Save as PDF</button>`:""}</section>`}
function actCard(a){
  const join=a.s>0?`<button class="btn" type="button" data-j="${Number(a.id)}" aria-expanded="false">Join this activity</button>
<form class="rsvp" id="r${Number(a.id)}" hidden data-api="rsvp" data-id="${Number(a.id)}" data-ok="You’re in.">${inp("Name","n","text",1,'autocomplete="name"')}${inp("Email","e","email",1,'autocomplete="email"')}${inp("Contact number","m","tel")}<button class="btn y" type="submit">Confirm RSVP</button></form>`
:`<button class="btn" type="button" disabled>Full</button>`;
  return `<article class="card"><span class="tag">${esc(a.c)}</span><h3>${esc(a.t)}</h3><div class="meta">${esc(a.d)}<br>${esc(a.v)}<br>${a.s} slots left</div><p>${esc(a.x)}</p>${join}</article>`}
function volunteer(){
  const upcoming=A.filter(isUpcoming), causes=[...new Set(upcoming.map(a=>a.c))];
  const past=A.filter(a=>!isUpcoming(a));
  const pastHtml=past.length?`<div class="row">${past.map((a,i)=>`<div class="card"><div class="cover c${i%3}" style="height:90px;font-size:1.1rem">${esc(a.t)}</div><div class="meta">${esc(a.d)}<br>${esc(a.v)}</div><p>${esc(a.x)}</p></div>`).join("")}</div>`:"<p>Past activities will show here after their date has passed.</p>";
  return `<section class="w"><h2>Weekly volunteer engagements</h2><p>Pick an activity, RSVP in a minute, and show up. Filter by cause:</p><label style="max-width:260px;margin-bottom:1.5rem">Cause<select id="cf"><option>All</option>${causes.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select></label><div class="g3" id="list"></div></section>
<section class="alt"><div class="w"><h2>Past activities</h2>${pastHtml}</div></section>`}
function contactCard(){
  const bits=[];
  if(site.email)bits.push(esc(site.email));
  if(site.phone)bits.push(esc(site.phone));
  if(site.address)bits.push(esc(site.address));
  if(site.hours)bits.push("Office hours: "+esc(site.hours));
  const map=/^https:\/\//i.test(site.map||"")?`<p><a href="${esc(site.map)}">Open the map</a></p>`:"";
  const body=bits.length?bits.join("<br>"):"Add PUBLIC_EMAIL, PUBLIC_PHONE, and PUBLIC_ADDRESS in the .env file, then restart the app.";
  return `<div class="card"><h3>Reach us</h3><p>${body}</p>${map}</div>`}
function contact(){return `<section class="w"><h2>Contact us</h2><p>Questions, partnerships, or media requests? Send us a message and we’ll reply within two working days.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2rem"><form data-api="contact" data-ok="Message sent. Salamat! We’ll reply soon.">${inp("Name","n","text",1,'autocomplete="name"')}${inp("Email","e","email",1,'autocomplete="email"')}
<label>Subject<select name="s"><option>General inquiry</option><option>Partnership</option><option>Volunteer</option><option>Media</option><option>Other</option></select></label>
<label>Message<textarea name="msg" rows="5" required></textarea></label><input class="hp" name="hp" tabindex="-1" autocomplete="off" aria-hidden="true"><button class="btn" type="submit">Send message</button></form>
<div>${contactCard()}</div></div></section>
<section class="alt"><div class="w"><h2>Frequently asked questions</h2>
<details><summary>Do I need experience to volunteer?</summary><p>No. We train you on the day.</p></details>
<details><summary>Is there a membership fee?</summary><p>No. Joining and volunteering are free.</p></details>
<details><summary>Can my school or group join together?</summary><p>Yes. Send us a message under Partnership.</p></details></div></section>`}
function grid(rows, kind){
  if(!rows||!rows.length)return "<p>No records yet.</p>";
  const keys=Object.keys(rows[0]);
  const head=keys.map(k=>`<th>${esc(k)}</th>`).join("")+(kind?"<th></th>":"");
  const body=rows.map(r=>`<tr>${keys.map(k=>`<td>${esc(r[k])}</td>`).join("")}${kind?`<td><button type="button" class="btn g" data-del="${kind}" data-id="${Number(r.id)}">Delete</button></td>`:""}</tr>`).join("");
  return `<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`}
function adminLock(message){return `<section class="w"><h2>Admin</h2><p>Enter the admin token from your .env file. This page shows volunteer names, phone numbers, and messages.</p>${message?`<p class="err" role="alert">${esc(message)}</p>`:""}<form id="admin-login"><label>Admin token<input name="token" type="password" required autocomplete="current-password"></label><button class="btn" type="submit">Unlock</button></form></section>`}
function adminPanel(data){
  return `<section class="w"><h2>Admin</h2><p>Records saved by the site. Add real activities and newsletters here, and delete the sample ones before you share the link.</p>
${adminNote?`<p class="ok" role="status">${esc(adminNote)}</p>`:""}
<button class="btn g" type="button" id="admin-out">Sign out</button>
<h3 style="margin-top:2rem">Add an activity</h3>
<form data-admin="activities">${inp("Title","title")}${inp("Cause","cause","text",1,'placeholder="Environment"')}${inp("Venue","venue")}${inp("Starts","starts_at","datetime-local")}${inp("Slots left","slots","number",1,'min="0" max="10000"')}<label>Description<textarea name="description" rows="3"></textarea></label><button class="btn" type="submit">Add activity</button></form>
<h3 style="margin-top:2rem">Activities</h3>${grid(data.activities,"activities")}
<h3>Add a newsletter</h3>
<form data-admin="newsletters"><label>Type<select name="type"><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></label>${inp("Title","title")}${inp("Date line","period","text",0,'placeholder="Dec 1 to Dec 7, 2026"')}${inp("Summary","summary","text",0)}${inp("Featured line","featured","text",0)}${inp("Publish date","published_at","date")}<label>Body<textarea name="body" rows="6" required placeholder="Write paragraphs separated by a blank line."></textarea></label>${inp("PDF link","pdf_url","url",0,'placeholder="https://"')}<button class="btn" type="submit">Publish issue</button></form>
<h3 style="margin-top:2rem">Newsletters</h3>${grid(data.newsletters,"newsletters")}
<h3>Volunteer sign-ups</h3>${grid(data.members)}
<h3>Newsletter subscribers</h3>${grid(data.subscribers)}
<h3>RSVPs</h3>${grid(data.rsvps)}
<h3>Messages</h3>${grid(data.contact_messages)}
</section>`}
async function adminFetch(method,url,body){
  const token=sessionStorage.getItem("kaubanta_admin")||"";
  const r=await fetch(url,{method,headers:{"Authorization":"Bearer "+token,...(body?{"Content-Type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401)throw new Error("That token was not accepted.");
  if(!r.ok)throw new Error(j.error||"Request failed.");
  return j;
}
async function renderAdmin(my){
  fillSocial();
  const token=sessionStorage.getItem("kaubanta_admin")||"";
  if(!token){if(my===seq)app.innerHTML=adminLock(adminNote); scrollTo(0,0); return}
  app.innerHTML=`<section class="w"><h2>Admin</h2><p>Loading records…</p></section>`;
  try{
    const names=["members","subscribers","rsvps","contact_messages","activities","newsletters"];
    const lists=await Promise.all(names.map(n=>adminFetch("GET","/api/admin/"+n)));
    if(my!==seq)return;
    const data=Object.fromEntries(names.map((n,i)=>[n,lists[i]]));
    app.innerHTML=adminPanel(data);
    adminNote="";
  }catch(err){
    if(my!==seq)return;
    if(err.message==="That token was not accepted."){sessionStorage.removeItem("kaubanta_admin"); app.innerHTML=adminLock(err.message)}
    else app.innerHTML=`<section class="w"><h2>Admin</h2><p class="err" role="alert">${esc(err.message)}</p><button class="btn g" type="button" id="admin-out">Sign out</button></section>`;
  }
  scrollTo(0,0);
}
function showAdmin(){renderAdmin(++seq)}
async function adminSubmit(f){
  const kind=f.dataset.admin, d={};
  new FormData(f).forEach((v,k)=>{d[k]=String(v).trim()});
  if(kind==="activities")d.slots=Number(d.slots);
  const button=f.querySelector("[type=submit]");
  button.disabled=true;
  try{await adminFetch("POST","/api/admin/"+kind,d); adminNote="Saved."; ready=null; showAdmin()}
  catch(err){
    button.disabled=false;
    let m=f.querySelector(".err");
    if(!m){m=document.createElement("p"); m.className="err"; m.setAttribute("role","alert"); f.append(m)}
    m.textContent=err.message;
  }
}
const P={home,about,signup,weekly:()=>nl("w"),monthly:()=>nl("m"),volunteer,contact};
const T={home:"Home",about:"About",signup:"Sign Up",weekly:"Weekly Newsletters",monthly:"Monthly Newsletters",volunteer:"Volunteer",contact:"Contact Us",admin:"Admin"};
function acts(c){const list=$("#list"); if(!list)return; const rows=A.filter(isUpcoming).filter(a=>c==="All"||a.c===c); list.innerHTML=rows.length?rows.map(actCard).join(""):`<p>${c==="All"?"No upcoming activities yet.":"No upcoming activities for that cause."}</p>`}
function go(){
  const my=++seq;
  let h=location.hash.slice(1)||"home";
  const m=h.match(/^issue-([wm])(\d+)$/);
  const page=m?(m[1]==="w"?"weekly":"monthly"):(h==="admin"||P[h]?h:"home");
  document.title=T[page]+" | KaubanTa Coalition";
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+page));
  $("#nav").classList.remove("open"); $("#mt").setAttribute("aria-expanded","false");
  ensure().then(fillSocial);
  if(page==="admin"){renderAdmin(my); return}
  app.innerHTML=`<section class="w"><p>Loading…</p></section>`;
  ensure().then(()=>{
    if(my!==seq)return;
    app.innerHTML=banner()+(m?issue(m[1],Number(m[2])):P[page]());
    if(page==="volunteer")acts("All");
    fillSocial();
    scrollTo(0,0);
  });
}
addEventListener("hashchange",go); go();
document.addEventListener("submit",async e=>{
  const f=e.target;
  if(!(f instanceof HTMLFormElement))return;
  if(f.id==="admin-login"){e.preventDefault(); sessionStorage.setItem("kaubanta_admin",String(new FormData(f).get("token")||"").trim()); adminNote=""; showAdmin(); return}
  if(f.dataset.admin){e.preventDefault(); adminSubmit(f); return}
  const api=f.dataset.api; if(!api)return;
  e.preventDefault();
  const d={}; new FormData(f).forEach((v,k)=>{d[k]=d[k]?d[k]+", "+v:v}); if(f.dataset.id)d.activity_id=+f.dataset.id;
  const b=f.querySelector("[type=submit]"); b.disabled=true;
  try{
    const r=await fetch("/api/"+api,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||"Something went wrong. Please try again.");
    ready=null;
    f.outerHTML=`<div class="ok" role="status">${esc(j.message||f.dataset.ok||"Saved.")}</div>`;
  }catch(x){
    b.disabled=false;
    const raw=x&&x.message?x.message:"";
    const msg=raw==="Failed to fetch"?"Can’t reach the server. Start the app, then try again.":(raw||"Something went wrong. Please try again.");
    let m=f.querySelector(".err"); if(!m){m=document.createElement("p"); m.className="err"; m.setAttribute("role","alert"); f.append(m)} m.textContent=msg;
  }
});
document.addEventListener("change",e=>{if(e.target.id==="cf")acts(e.target.value)});
document.addEventListener("click",e=>{
  const del=e.target.closest("[data-del]");
  if(del){
    const kind=del.dataset.del;
    if(!confirm(kind==="activities"?"Delete this activity and its RSVPs?":"Delete this newsletter?"))return;
    adminFetch("DELETE","/api/admin/"+kind+"/"+del.dataset.id).then(()=>{adminNote="Deleted."; ready=null; showAdmin()}).catch(err=>alert(err.message));
    return;
  }
  if(e.target.id==="admin-out"){sessionStorage.removeItem("kaubanta_admin"); adminNote=""; showAdmin(); return}
  const b=e.target.closest("[data-j]");
  if(b){const f=$("#r"+b.dataset.j); f.hidden=!f.hidden; b.setAttribute("aria-expanded",String(!f.hidden))}
  if(e.target.id==="mt"){const o=$("#nav").classList.toggle("open"); e.target.setAttribute("aria-expanded",String(o))}
});
</script>
</body>
</html>
